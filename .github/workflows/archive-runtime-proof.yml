name: Archive runtime image proof
run-name: Archive runtime proof ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release whose runtime-image.json should be preserved in Actions
        type: string
        required: true
        default: "2.0.0"

permissions:
  contents: read
  actions: read

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify and copy the original release audit record
        run: python3 scripts/runtime_image.py archive --version "$VERSION" --directory .ci-output/runtime-proof
      - name: Keep the audit record as an Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-image-${{ inputs.version }}
          path: .ci-output/runtime-proof/runtime-image.json
          include-hidden-files: true
          if-no-files-found: error
