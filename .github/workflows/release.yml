name: Prepare Dyntick release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Distribution version, for example 2.0.0
        required: true
        default: "2.0.0"
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
