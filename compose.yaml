name: dyntick

services:
  dyntick:
    image: dyntick-local:${DYNTICK_VERSION:-1.0.2}
    pull_policy: build
    build:
      context: https://github.com/IlCandeDEV/dyntick.git#v${DYNTICK_VERSION:-1.0.2}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
