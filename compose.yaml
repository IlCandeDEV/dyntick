name: dyntick

services:
  dyntick:
    image: ghcr.io/ilcandedev/dyntick-runtime:${DYNTICK_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - dyntick-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  dyntick-data:
